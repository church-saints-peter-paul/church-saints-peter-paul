        // --- Progress Tracking ---
        function setupProgressTracking() {
            const content = document.querySelector('.reading-text');
            const progressBar = document.getElementById('progress-bar');
            
            if (!content) return;
            
            const updateProgress = () => {
                const contentHeight = content.offsetHeight;
                const windowHeight = window.innerHeight;
                const scrollPosition = window.scrollY;
                const scrollableHeight = contentHeight - windowHeight;
                
                if (scrollableHeight > 0) {
                    const progress = (scrollPosition / scrollableHeight) * 100;
                    progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';
                } else {
                    progressBar.style.width = '100%';
                }
            };
            
            window.addEventListener('scroll', updateProgress);
            updateProgress(); // Initial update
        }

        // --- Bookmark System ---
        function toggleBookmark() {
            if (!currentPrayerId) return;
            
            const btn = document.getElementById('bookmark-btn');
            const index = bookmarkedPrayers.indexOf(currentPrayerId);
            
            if (index === -1) {
                // Add bookmark
                bookmarkedPrayers.push(currentPrayerId);
                btn.classList.add('active');
                showNotification('تم إضافة العلامة بنجاح');
            } else {
                // Remove bookmark
                bookmarkedPrayers.splice(index, 1);
                btn.classList.remove('active');

            setTimeout(() => {
                notification.style.transform = 'translateX(120%)';

                    const isOpen = parent.classList.contains("open");
                    
                    // Close all other accordions

                        if (openAcc !== parent) {
                            openAcc.classList.remove("open");

                    // Toggle current accordion

                    // Smooth scroll to accordion if opening

                        }, 300);

                });
            });

                const green = Math.floor(28 - (28 * progress));
                const blue = Math.floor(28 - (28 * progress));
                btn.style.background = `linear-gradient(135deg, rgb(${red}, ${green}, ${blue}), var(--primary-dark))`;
            } else if (count === 1) {
                btn.innerText = "آمين";
                btn.classList.add('finished');
                btn.disabled = true;
                
                // Celebration effect
                setTimeout(() => {
                    showNotification('تم الانتهاء من الصلاة! الله يسمع صلاتك');
                }, 300);
                
                setTimeout(() => {
                    btn.innerText = "41";
                    btn.classList.remove('finished');
                    btn.style.background = "";
                    btn.disabled = false;
                }, 3000);
            }
        }

        // Font & Theme
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('agpeya_theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            
            // Update meta theme color
            const metaThemeColor = document.querySelector("meta[name=theme-color]");
            if (metaThemeColor) {
                metaThemeColor.setAttribute("content", isDark ? "#121212" : "#f7f3e8");
            }
        }

        function toggleFontPanel() {
            const panel = document.getElementById('font-panel');
            panel.classList.toggle('active');
            
            // Close on click outside
            if (panel.classList.contains('active')) {
                setTimeout(() => {
                    document.addEventListener('click', closeFontPanelOnClickOutside);
                }, 10);
            } else {
                document.removeEventListener('click', closeFontPanelOnClickOutside);
            }
        }
        
        function closeFontPanelOnClickOutside(event) {
            const panel = document.getElementById('font-panel');
            const fontBtn = document.querySelector('.icon-btn[onclick="toggleFontPanel()"]');
            
            if (!panel.contains(event.target) && !fontBtn.contains(event.target)) {
                panel.classList.remove('active');
                document.removeEventListener('click', closeFontPanelOnClickOutside);
            }
        }

        function setFontSize(size, btn) {
            document.body.classList.remove('font-sm', 'font-md', 'font-lg', 'font-xl');
            document.body.classList.add(size);
            localStorage.setItem('agpeya_font', size);
            
            // Active state
            document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            setTimeout(toggleFontPanel, 200);
        }

        // Scroll Observer
        window.addEventListener('scroll', () => {
            const fab = document.getElementById('fab');
            if (window.scrollY > 300) {
                fab.classList.add('visible');
            } else {
                fab.classList.remove('visible');
                document.getElementById('font-panel').classList.remove('active');
            }
            
            // Hide/show header on scroll
            const header = document.querySelector('.app-header');
            const currentScroll = window.pageYOffset;
            
            if (currentScroll > lastScrollPosition && currentScroll > 100) {
                // Scrolling down
                header.style.transform = 'translateY(-100%)';
            } else {
                // Scrolling up
                header.style.transform = 'translateY(0)';
            }
            
            lastScrollPosition = currentScroll;
        });

        // --- Keyboard Shortcuts ---
        document.addEventListener('keydown', (e) => {
            // Escape key to go home
            if (e.key === 'Escape' && currentPrayerId) {
                goHome();
            }
            
            // Space bar to toggle accordion
            if (e.key === ' ' && document.activeElement.classList.contains('accordion-header')) {
                e.preventDefault();
                document.activeElement.click();
            }
            
            // Ctrl/Cmd + D to toggle dark mode
            if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
                e.preventDefault();
                toggleTheme();
            }
            
            // Ctrl/Cmd + B to toggle bookmark
            if ((e.ctrlKey || e.metaKey) && e.key === 'b' && currentPrayerId) {
                e.preventDefault();
                toggleBookmark();
            }
        });

        // --- Install Prompt ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            
            // Show install button (optional)
            showInstallButton();
        });
        
        function showInstallButton() {
            // You can add an install button to your UI here
            console.log('App can be installed');
        }
        
        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    } else {
                        console.log('User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                });
            }
        }

        // --- Share Functionality ---
        function sharePrayer() {
            if (navigator.share && currentPrayerId) {
                const prayer = prayersData.find(p => p.id === currentPrayerId);
                navigator.share({
                    title: `صلاة ${prayer.title} - الأجبية المقدسة`,
                    text: `اقرأ صلاة ${prayer.title} من الأجبية المقدسة`,
                    url: window.location.href,
                });
            } else {
                // Fallback: copy to clipboard
                const prayer = prayersData.find(p => p.id === currentPrayerId);
                const text = `صلاة ${prayer.title} - الأجبية المقدسة\n${window.location.href}`;
                
                navigator.clipboard.writeText(text).then(() => {
                    showNotification('تم نسخ الرابط');
                });
            }
        }

        // --- Init App ---
        document.addEventListener('DOMContentLoaded', () => {
            initDashboard();

            // Load saved settings
            const savedTheme = localStorage.getItem('agpeya_theme');
            if(savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-icon').className = 'fas fa-sun';
            }

            const savedFont = localStorage.getItem('agpeya_font');
            if(savedFont) {
                document.body.classList.remove('font-md');
                document.body.classList.add(savedFont);
                // Update active button
                document.querySelectorAll('.font-btn').forEach(b => {
                    b.classList.remove('active');
                    if(b.getAttribute('onclick').includes(savedFont)) b.classList.add('active');
                });
            }
            
            // Set theme color meta tag
            const metaThemeColor = document.createElement('meta');
            metaThemeColor.name = 'theme-color';
            metaThemeColor.content = document.body.classList.contains('dark-mode') ? '#121212' : '#f7f3e8';
            document.head.appendChild(metaThemeColor);
            
            // Add share button to header
            const shareBtn = document.createElement('button');
            shareBtn.className = 'icon-btn';
            shareBtn.innerHTML = '<i class="fas fa-share-alt"></i>';
            shareBtn.title = 'مشاركة';
            shareBtn.onclick = sharePrayer;
            document.querySelector('.header-controls').insertBefore(shareBtn, document.querySelector('.header-controls').firstChild);
            
            // Add install button if PWA is available
            if (window.matchMedia('(display-mode: standalone)').matches) {
                console.log('Running in standalone mode');
            }
            
            // Add service worker for PWA
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js').catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
                });
            }
            
            // Add offline support notification
            window.addEventListener('online', () => {
                showNotification('تم استعادة الاتصال بالإنترنت');
            });
            
            window.addEventListener('offline', () => {
                showNotification('أنت غير متصل بالإنترنت - التطبيق يعمل في الوضع غير المتصل');
            });
            
            // Initial offline check
            if (!navigator.onLine) {
                showNotification('التطبيق يعمل في الوضع غير المتصل');
            }
        });

        // --- Animation on scroll ---
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animated');
                }
            });
        }, observerOptions);

        // Observe all prayer cards
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.prayer-card').forEach(card => {
                observer.observe(card);
            });
        });

        // --- Print Functionality ---
        function printPrayer() {
            if (!currentPrayerId) return;
            
            const prayer = prayersData.find(p => p.id === currentPrayerId);
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html dir="rtl" lang="ar">
                <head>
                    <meta charset="UTF-8">
                    <title>${prayer.title} - الأجبية المقدسة</title>
                    <style>
                        body { font-family: 'Amiri', serif; line-height: 2; padding: 20px; }
                        h1 { color: #8a1c1c; text-align: center; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
                        h3 { color: #d4af37; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
                        .rubric { color: #8a1c1c; font-weight: bold; display: block; margin: 10px 0; }
                        @media print {
                            body { font-size: 14pt; }
                            h1 { font-size: 24pt; }
                        }
                    </style>
                </head>
                <body>
                    <h1>${prayer.title}</h1>
                    <p><strong>${prayer.subtitle}</strong></p>
                    <hr>
                    <div>${document.querySelector('.reading-text').innerHTML}</div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => {
                printWindow.print();
                printWindow.close();
            }, 250);
        }
        
        // Add print button to header
        const printBtn = document.createElement('button');
        printBtn.className = 'icon-btn';
        printBtn.innerHTML = '<i class="fas fa-print"></i>';
        printBtn.title = 'طباعة';
        printBtn.onclick = printPrayer;
        document.querySelector('.header-controls').insertBefore(printBtn, document.querySelector('.header-controls').firstChild);

        // --- Search Functionality ---
        function searchPrayers() {
            const searchModal = document.createElement('div');
            searchModal.className = 'search-modal';
            searchModal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.8);
                backdrop-filter: blur(10px);
                z-index: 2000;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding-top: 100px;
            `;
            
            searchModal.innerHTML = `
                <div class="search-container" style="
                    background: var(--bg-card);
                    width: 90%;
                    max-width: 600px;
                    border-radius: 20px;
                    padding: 30px;
                    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                ">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 style="color: var(--primary); margin: 0;">بحث في الأجبية</h3>
                        <button onclick="this.closest('.search-modal').remove()" style="
                            background: none;
                            border: none;
                            font-size: 1.5rem;
                            color: var(--text-sec);
                            cursor: pointer;
                        ">×</button>
                    </div>
                    <input type="text" id="search-input" placeholder="اكتب كلمة للبحث..." style="
                        width: 100%;
                        padding: 15px;
                        border: 2px solid var(--border);
                        border-radius: 12px;
                        font-size: 1.1rem;
                        background: var(--bg-body);
                        color: var(--text-main);
                        margin-bottom: 20px;
                    ">
                    <div id="search-results" style="max-height: 400px; overflow-y: auto;"></div>
                </div>
            `;
            
            document.body.appendChild(searchModal);
            
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            
            searchInput.focus();
            
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                searchResults.innerHTML = '';
                
                if (query.length < 2) {
                    searchResults.innerHTML = '<p style="text-align: center; color: var(--text-sec);">اكتب كلمتين على الأقل للبحث</p>';
                    return;
                }
                
                const results = [];
                
                prayersData.forEach(prayer => {
                    // Search in title and subtitle
                    if (prayer.title.toLowerCase().includes(query) || 
                        prayer.subtitle.toLowerCase().includes(query)) {
                        results.push({
                            type: 'prayer',
                            prayer: prayer,
                            match: prayer.title
                        });
                    }
                    
                    // Search in content
                    prayer.content.psalms.forEach(psalm => {
                        if (psalm.text.toLowerCase().includes(query)) {
                            results.push({
                                type: 'psalm',
                                prayer: prayer,
                                psalm: psalm,
                                match: psalm.text.substring(
                                    psalm.text.toLowerCase().indexOf(query),
                                    psalm.text.toLowerCase().indexOf(query) + 50
                                ) + '...'
                            });
                        }
                    });
                });
                
                if (results.length === 0) {
                    searchResults.innerHTML = '<p style="text-align: center; color: var(--text-sec);">لا توجد نتائج</p>';
                    return;
                }
                
                results.forEach(result => {
                    const resultElement = document.createElement('div');
                    resultElement.className = 'search-result';
                    resultElement.style.cssText = `
                        padding: 15px;
                        margin-bottom: 10px;
                        background: var(--bg-body);
                        border-radius: 10px;
                        border-left: 4px solid var(--primary);
                        cursor: pointer;
                        transition: all 0.3s;
                    `;
                    resultElement.innerHTML = `
                        <div style="font-weight: bold; color: var(--primary); margin-bottom: 5px;">
                            ${result.type === 'prayer' ? 'صلاة' : 'مزمور'}: ${result.prayer.title}
                        </div>
                        <div style="color: var(--text-sec); font-size: 0.9rem;">
                            ${result.match}
                        </div>
                    `;
                    
                    resultElement.addEventListener('click', () => {
                        loadPrayer(result.prayer.id);
                        searchModal.remove();
                        
                        // If it's a psalm search, open the accordion
                        if (result.type === 'psalm') {
                            setTimeout(() => {
                                const accordions = document.querySelectorAll('.accordion');
                                accordions.forEach((acc, index) => {
                                    if (acc.querySelector('.accordion-header').textContent.includes(result.psalm.title)) {
                                        acc.classList.add('open');
                                        acc.scrollIntoView({ behavior: 'smooth' });
                                    }
                                });
                            }, 500);
                        }
                    });
                    
                    searchResults.appendChild(resultElement);
                });
            });
            
            // Close on escape
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchModal.remove();
                }
            });
        }
        
        // Add search button to header
        const searchBtn = document.createElement('button');
        searchBtn.className = 'icon-btn';
        searchBtn.innerHTML = '<i class="fas fa-search"></i>';
        searchBtn.title = 'بحث';
        searchBtn.onclick = searchPrayers;
        document.querySelector('.header-controls').insertBefore(searchBtn, document.querySelector('.header-controls').firstChild);
    </script>

    <!-- Service Worker Registration (Optional) -->
    <script>
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>

    <!-- Add some additional styles for new features -->
    <style>
        /* Search Modal Styles */
        .search-modal {
            animation: fadeIn 0.3s ease;
        }
        
        .search-result:hover {
            transform: translateX(-5px);
            background: rgba(138, 28, 28, 0.05) !important;
        }
        
        /* Print Styles */
        @media print {
            .app-header,
            .fab,
            .bookmark-btn,
            .font-panel,
            .prayer-progress {
                display: none !important;
            }
            
            .app-container {
                padding: 0 !important;
                max-width: 100% !important;
            }
            
            .prayer-title-box {
                box-shadow: none !important;
                border: 2px solid #000 !important;
            }
            
            .reading-text {
                font-size: 14pt !important;
                line-height: 1.8 !important;
            }
            
            .kyrie-container {
                page-break-inside: avoid;
            }
            
            .separator {
                display: none !important;
            }
        }
        
        /* Animation for elements */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Responsive adjustments for new buttons */
        @media (max-width: 768px) {
            .header-controls {
                gap: 8px;
            }
            
            .icon-btn {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 480px) {
            .header-controls {
                gap: 5px;
            }
            
            .icon-btn {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
        }
        
        /* Smooth transitions for dark mode */
        .prayer-card,
        .prayer-title-box,
        .accordion,
        .kyrie-container {
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        /* Focus styles for accessibility */
        button:focus,
        .accordion-header:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
